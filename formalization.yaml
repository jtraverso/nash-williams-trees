version: "v0.4"

project:
  name: "The Nash-Williams–Tutte tree packing theorem and Nash-Williams' arboricity theorem"
  description: >-
    A Lean 4 / Mathlib formalization of three classical results on edge-disjoint trees and forests
    in finite simple graphs, none of which is in Mathlib. (1) The Nash-Williams–Tutte tree packing
    theorem: a graph has k edge-disjoint spanning trees if and only if every partition of its
    vertices into m parts has at least k(m − 1) edges between different parts. (2) Nash-Williams'
    arboricity theorem: the edges can be covered by k forests if and only if every nonempty vertex
    set S spans at most k(|S| − 1) edges. (3) The corollary that every 2k-edge-connected graph has
    k edge-disjoint spanning trees. Mathlib has no matroid union theorem and no graphic matroid;
    the proofs are direct edge-exchange arguments.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

