status:
  scope: >-
    Proved for every finite simple graph and every k (tree packing on a nonempty vertex type;
    arboricity on any finite vertex type; the corollary for every 2k-edge-connected graph on a
    nonempty finite vertex type).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

