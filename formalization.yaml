      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced all proofs in one run from the formal statements and a proof plan (Diestel's
        exchange argument, Chen et al.'s short proof, and a cut-counting argument for the
        corollary); the return was audited (statements and headers unchanged, no added axioms)
        and rebuilt locally.
      cost:
